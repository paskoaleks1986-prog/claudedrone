# drone_geometry.yaml — ЕДИНЫЙ источник физики дрона для v5-krot Этап-1.
# Контракт: v5_krot_pilot_stage1_surface_contract_v2.md §1 (researchbest).
# Владелец файла: simulation (заполняет по реальному железу). Читатель: rl-lab (env).
#
# ПРИНЦИП: ни одной зашитой safety-константы. ВСЕ пороги вычисляются ФОРМУЛАМИ
# (см. ниже) из этих ВХОДНЫХ параметров. Поменял число → вся полоса пересчиталась,
# код не трогаем, RL с нуля не переучиваем.
#
# СТАТУС ЧИСЕЛ:
#   [REAL] = замерено на реальном железе (its_claudedrone)
#   [SIM]  = из gz-модели iris_claudedrone (БОЛЬШЕ реального дрона → консервативно по safety)
#   [SIM*] = замерено simulation по SDF 2026-06-24 (см. ниже «ЗАМЕРЫ»)
#
# 🔁 СВАП НА РЕАЛЬНЫЙ ДРОН: замерить body_half/motor_arm/sensor_ring_r на железе →
#    править ТОЛЬКО эти 3 строки. Реальный дрон МЕНЬШЕ iris → опасный радиус меньше →
#    можно жаться ближе (теснее d*). Бесшовно, без ретрейна (+ geometry-DR на тренинге).

geometry:
  # ── ВХОДНЫЕ параметры (физика) ──────────────────────────────────────────
  body_half:      0.09        # [SIM] полуширина корпуса (iris collision-mesh ~0.18). Оценка bbox,
                              #       НЕ box — base_collision = iris_collision.stl. Некритично (prop_tip доминирует).
  motor_arm:      0.256       # [SIM*] центр → ось мотора. ЗАМЕР по iris_claudedrone rotor-pose
                              #        max|(0.13,0.22)| = sqrt(0.13^2+0.22^2) = 0.2556.
                              #        ⚠ контракт-заглушка была 0.17 — занижала! (см. РАСХОЖДЕНИЕ)
  prop_radius:    0.063       # [REAL] ✅ радиус винта 5"/2 = 63мм (Aleks). В SDF винтов нет — число от железа.
  sensor_ring_r:  0.10        # [SIM*] радиус mount VL53 от центра. ЗАМЕР: ch0 @ x=0.10; ch1 sqrt(0.05^2+0.087^2)=0.100.
                              #        ⚠ контракт-заглушка была 0.09 (из non-iris claudedrone-модели).
  sensor_angles_deg: [0, 60, 120, 180, 240, 300]   # [SIM*] раскладка 6 лучей VL53 (body-frame).
                              #        ЗАМЕР: iris_claudedrone vl53l0x_0..5 yaw 0/1.0472/2.0944/3.1416/4.1888/5.2360.
                              #        index0 = +x (нос/0°), CCW по 60°. PARITY sim↔rl ОБЯЗАТЕЛЬНА.
  tof_clip_m:     1.2         # клип дальности ToF в obs (контракт §2.1). SDF range max=2.0 — клип в софте.
  tof_min_m:      0.03        # [SIM*] физ. min VL53 (SDF range min=0.03).

  # ── safety/standoff буферы (P0-tunable) ─────────────────────────────────
  margin:         0.06        # буфер no-graze (м, кадр луча): шум ToF + ошибка управления
  clear:          0.05        # доп. зазор луч↔стена для d*_min (м)

  # ── управление (контракт §3, ответ research 12:4x) ──────────────────────
  v_max:          0.6         # м/с, |v|≤v_max (этап-1)
  v_cruise:       0.2         # м/с, baseline крейсер вдоль стены (oracle seed §8)
  control_hz:     20          # Гц (dt=0.05) — PARITY sim↔rl ОБЯЗАТЕЛЬНА
  d_star_target:  0.40        # P0-калибровка standoff (кадр луча). research c6d6c6a: на iris d*_min=0.329,
                              #   target 0.40 даёт запас над GRAZE 0.121 / над d*_min 0.071 (комфортно). НЕ 0.35.
  d_star_p1_range: [0.34, 0.50] # P1+ ТРЕНИНГ: сэмпл d* в этой iris-валидной полосе (репертуар)
  d_star_range:   [0.25, 0.60]  # obs §2.9 нормировка d_star_cmd (широкий диапазон карты команд)

# ─────────────────────────────────────────────────────────────────────────
# ВЫЧИСЛЯЕМОЕ В КОДЕ (формулы, НЕ константы — env/wall_gt_node считают сами):
#   prop_tip      = motor_arm + prop_radius          # опасный радиус ОТ ЦЕНТРА (кончик винта)
#   prop_tip_beam = prop_tip - sensor_ring_r         # тот же предел В КАДРЕ ЛУЧА (что читает VL53)
#   d_graze       = prop_tip_beam + margin           # HARD no-graze floor (луч)
#   d_star_min    = d_graze + clear                  # мин. командуемый standoff (луч)
#
# ПОЛОСА при ТЕКУЩИХ [SIM*] замерах (motor_arm 0.256, sensor_ring_r 0.10):
#   prop_tip      = 0.256 + 0.063 = 0.319 м
#   prop_tip_beam = 0.319 - 0.10  = 0.219 м   (луч 0.219 = винт КАСАЕТСЯ стены = абс.пол)
#   d_graze       = 0.219 + 0.06  = 0.279 м   (GRAZE floor)
#   d_star_min    = 0.279 + 0.05  = 0.329 м   (мин. командуемый standoff)
#   P0-target d*=0.40 → запас target→GRAZE = 0.40 - 0.279 = 0.121 м (research c6d6c6a, комфортно)
#   HUG-потолок ~0.50 · DRIFT >0.50 · LOST >1.2. P1+ тренинг сэмпл d*∈[0.34,0.50].
#
# ─────────────────────────────────────────────────────────────────────────
# 🔴 РАСХОЖДЕНИЕ С КОНТРАКТОМ v2 §1 (флаг → researchbest, владелец полосы):
#   Контракт-заглушки: motor_arm 0.17, sensor_ring_r 0.09 → prop_tip 0.233, d_graze 0.203,
#     d_star_min 0.253, запас target→GRAZE 0.147.
#   РЕАЛЬНАЯ iris-модель (замер sim): motor_arm 0.256, sensor_ring_r 0.10 → prop_tip 0.319,
#     d_graze 0.279, d_star_min 0.329, запас 0.071.
#   СЛЕДСТВИЕ: на SIM-iris d*_min поднимается 0.25→0.33, target 0.35 даёт лишь 0.071 запаса.
#   Решение за research: (a) принять тесную полосу на iris (реальный дрон МЕНЬШЕ → запас вернётся),
#     либо (b) поднять target d* на iris-этапе, либо (c) geometry-DR покрывает оба размера.
#   Числа честные (SDF — истина по sim-коллизии). prop_radius=0.063 [REAL] не трогал.
