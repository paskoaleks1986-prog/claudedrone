# worlds.yaml — per-world геометрия bridge (Блок Б, директива Aleks 2026-06-07).
#
# Источник истины для room_size: SDF мира (bbox стен). Bridge выбирает запись
# по имени мира (launch arg world_name / env DEFAULT_WORLD). Мир без записи =
# fail-fast при старте ноды: КАЖДЫЙ летаемый мир обязан быть здесь осознанно
# (конфиги на особом контроле — никаких тихих дефолтов).
#
# Поля:
#   room_size: [x_m, y_m] — габариты комнаты (внешний bbox стен), origin центр
#   grid_resolution: м/клетку (0.1 — канон протокола; другое значение = WARN:
#                    модели обучены на 0.1)
#
# ⚠ Модельный obs-контракт ActiveMapping-v1 (64×64 @ 0.1) НЕ растягивается:
# в мирах больше 6.4×6.4 модель работает OOD (bridge предупреждает в логе).
# Per-world задаётся ГЕОМЕТРИЯ bridge: safe-box, visited/coverage/occupancy гриды.
#
# ═══ СТАНДАРТ МИРА (Alignment Sprint Блок 1, Aleks 2026-06-07) ═══
#   wall_height : ≥ 4.0 м  (запас над max эшелоном 3.0 + 1.0; takeoff z=2.0)
#   spawn_pose  : центр комнаты, yaw=0° (single-room); multi-room — в камере 1
#   grid_origin : центр bbox (0,0); для single-room совпадает со spawn
#   room_size   : кратно 0.1 м (= grid_resolution)
#   doorways    : ширина ≥ 1.0 м (2× габарита дрона)
# Значения room_size/wall_height ИЗМЕРЕНЫ по SDF (не из памяти). Высоты стен
# живут в SDF (здесь — для справки/аудита); bridge их не читает.

worlds:
  rl_room_empty_6x6:
    room_size: [6.4, 6.4]      # SDF bbox 6.4; wall_height 4.0 ✓; spawn центр
    grid_resolution: 0.1
  rl_room_pillar_center:
    room_size: [6.4, 6.4]      # wall_height 4.0 ✓ pillar 1×1×4.0; spawn зона SW
    grid_resolution: 0.1
  rl_room_two_chambers:
    room_size: [6.4, 6.4]      # wall_height 4.0 ✓; дверь между камерами 1.2 м
    grid_resolution: 0.1
  indoor_room:
    # измерено по SDF: bbox x ±8.0, y ±5.0 (стены 0.15). wall_height 3.0→4.0
    # поднято (Alignment Блок 1). multi-room: spawn (-6.5,-3.5) камера 1,
    # grid_origin = центр bbox (0,0); дверь-проём 3.0 м.
    room_size: [16.0, 10.0]
    grid_resolution: 0.1
