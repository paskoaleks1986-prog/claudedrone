<svg width="680" height="545" viewBox="0 0 680 545" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Title -->
<text x="340" y="22" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">ClaudeDrone — Wiring Diagram v1</text>
<text x="340" y="38" text-anchor="middle" font-size="11" fill="#888">Phase 0 · ESP32 + RPi Zero 2W · без пинов FC (TODO)</text>

<!-- I2C bus spine -->
<line x1="200" y1="183" x2="200" y2="303" stroke="#378ADD" stroke-width="2"/>
<line x1="265" y1="275" x2="200" y2="275" stroke="#378ADD" stroke-width="2"/>
<line x1="200" y1="183" x2="162" y2="183" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="303" x2="172" y2="303" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="105" y1="331" x2="105" y2="393" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="200" cy="183" r="3.5" fill="#378ADD"/>
<circle cx="200" cy="275" r="3.5" fill="#378ADD"/>
<circle cx="200" cy="303" r="3.5" fill="#378ADD"/>
<text x="208" y="244" font-size="11" fill="#378ADD">I2C</text>

<!-- PWM: PCA9685 → SG90 -->
<line x1="100" y1="155" x2="100" y2="86" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="106" y="125" font-size="11" fill="#1D9E75">PWM</text>

<!-- UART0: ESP32 ↔ RPi -->
<polyline points="415,250 455,250 455,68 478,68" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460" y="148" font-size="11" fill="#639922">UART0</text>

<!-- UART1: ESP32 → TF-Luna scan -->
<line x1="415" y1="268" x2="478" y2="183" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="418" y="228" font-size="11" fill="#639922">UART1</text>

<!-- UART2: ESP32 → TF-Luna alt -->
<line x1="415" y1="288" x2="478" y2="278" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="418" y="273" font-size="11" fill="#639922">UART2</text>

<!-- SBUS/MSP: ESP32 → FC -->
<line x1="415" y1="340" x2="478" y2="383" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420" y="346" font-size="11" fill="#BA7517">SBUS</text>

<!-- SPI: ESP32 → PMW3901 -->
<line x1="325" y1="380" x2="325" y2="453" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="422" font-size="11" fill="#7F77DD">SPI</text>

<!-- WiFi: RPi → External PC -->
<line x1="565" y1="40" x2="565" y2="24" stroke="#999" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="565" y="16" text-anchor="middle" font-size="10" fill="#999">WiFi → External PC</text>

<!-- === SG90 servo === -->
<rect x="40" y="42" width="120" height="44" rx="8" fill="#f1efe8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="68" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">SG90 servo</text>

<!-- === PCA9685 === -->
<rect x="40" y="155" width="120" height="56" rx="8" fill="#e1f5ee" stroke="#0F6E56" stroke-width="0.5"/>
<text x="100" y="176" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">PCA9685</text>
<text x="100" y="193" text-anchor="middle" font-size="11" fill="#085041">PWM driver</text>

<!-- === TCA9548A === -->
<rect x="40" y="275" width="130" height="56" rx="8" fill="#e1f5ee" stroke="#0F6E56" stroke-width="0.5"/>
<text x="105" y="296" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">TCA9548A</text>
<text x="105" y="313" text-anchor="middle" font-size="11" fill="#085041">I2C mux × 8 ch</text>

<!-- === VL53L0X × 6 === -->
<rect x="25" y="395" width="155" height="56" rx="8" fill="#f1efe8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="102" y="416" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">VL53L0X × 6</text>
<text x="102" y="433" text-anchor="middle" font-size="11" fill="#444441">360° obstacle ToF</text>

<!-- === ESP32 (center hub) === -->
<rect x="265" y="220" width="150" height="160" rx="10" fill="#e6f1fb" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">ESP32</text>
<text x="340" y="303" text-anchor="middle" font-size="11" fill="#185FA5">DevKit</text>
<text x="340" y="320" text-anchor="middle" font-size="11" fill="#185FA5">real-time MCU</text>

<!-- === RPi Zero 2W === -->
<rect x="480" y="42" width="170" height="56" rx="8" fill="#eeedfe" stroke="#534AB7" stroke-width="0.5"/>
<text x="565" y="63" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C">RPi Zero 2W</text>
<text x="565" y="80" text-anchor="middle" font-size="11" fill="#3C3489">WiFi bridge</text>

<!-- === TF-Luna scan === -->
<rect x="480" y="155" width="155" height="56" rx="8" fill="#f1efe8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="557" y="176" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">TF-Luna</text>
<text x="557" y="193" text-anchor="middle" font-size="11" fill="#444441">scanning lidar</text>

<!-- === TF-Luna alt === -->
<rect x="480" y="250" width="155" height="56" rx="8" fill="#f1efe8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="557" y="271" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">TF-Luna</text>
<text x="557" y="288" text-anchor="middle" font-size="11" fill="#444441">altimeter</text>

<!-- === Flight Controller === -->
<rect x="480" y="355" width="150" height="56" rx="8" fill="#faeeda" stroke="#854F0B" stroke-width="0.5"/>
<text x="555" y="376" text-anchor="middle" font-size="13" font-weight="500" fill="#412402">Flight Controller</text>
<text x="555" y="393" text-anchor="middle" font-size="11" fill="#633806">F4/F7 FC</text>

<!-- === PMW3901 === -->
<rect x="265" y="455" width="150" height="56" rx="8" fill="#f1efe8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="476" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">PMW3901</text>
<text x="340" y="493" text-anchor="middle" font-size="11" fill="#444441">optical flow</text>

<!-- === Legend === -->
<rect x="25" y="468" width="210" height="68" rx="6" fill="none" stroke="#ccc" stroke-width="0.8"/>
<text x="37" y="484" font-size="10" font-weight="600" fill="#555">Протоколы / Protocols</text>
<line x1="37" y1="496" x2="57" y2="496" stroke="#378ADD" stroke-width="2"/>
<text x="62" y="500" font-size="10" fill="#555">I2C (SDA/SCL)</text>
<line x1="37" y1="510" x2="57" y2="510" stroke="#639922" stroke-width="1.5"/>
<text x="62" y="514" font-size="10" fill="#555">UART (TX/RX)</text>
<line x1="120" y1="496" x2="140" y2="496" stroke="#7F77DD" stroke-width="1.5"/>
<text x="145" y="500" font-size="10" fill="#555">SPI</text>
<line x1="120" y1="510" x2="140" y2="510" stroke="#1D9E75" stroke-width="1.5"/>
<text x="145" y="514" font-size="10" fill="#555">PWM</text>
<line x1="37" y1="524" x2="57" y2="524" stroke="#BA7517" stroke-width="1.5"/>
<text x="62" y="528" font-size="10" fill="#555">SBUS / MSP</text>
<line x1="120" y1="524" x2="140" y2="524" stroke="#999" stroke-dasharray="3 2" stroke-width="1.2"/>
<text x="145" y="528" font-size="10" fill="#555">WiFi</text>
</svg>
